<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orders | Parking Meter Store</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
:root { --primary:#2563eb; --dark:#1e293b; --light:#f8fafc; --text:#334155; --success:#16a34a; }
body { margin:0; font-family:'Segoe UI',Roboto,Arial,sans-serif; color:var(--text); background:linear-gradient(135deg,#e0eafc 0%,#cfdef3 100%); min-height:100vh; display:flex; flex-direction:column; }
.navbar, footer { background:rgba(255,255,255,.94); border-color:#b0c4de!important; }
.navbar-brand { font-weight:800; color:var(--dark)!important; }
main { flex:1; }
.hero { padding:3rem 0 2rem; }
.hero-panel, .soft-card { background:white; border:1px solid rgba(255,255,255,.8); border-radius:24px; box-shadow:0 15px 35px rgba(0,0,0,.08); }
.product-icon { font-size:3rem; }
.price { font-size:1.35rem; font-weight:800; color:#1d4ed8; }
.btn-primary { background:linear-gradient(135deg,#3498db,#2980b9); border:0; }
.btn-primary:hover { background:#1d4ed8; }
.form-control, .form-select { border-radius:14px; padding:.75rem 1rem; }
footer a { color:#2980b9; text-decoration:none; margin-right:1rem; font-weight:600; }
footer a:hover { text-decoration:underline; }
.status { min-height:1.5rem; }
</style>
</head>
<body>
<nav class="navbar navbar-expand-lg border-bottom border-2">
  <div class="container">
    <a class="navbar-brand" href="/">🅿️ Parking Meter Store</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="mainNav">
      <div class="navbar-nav ms-auto">
        <a class="nav-link" href="/">Home</a>
        <a class="nav-link" href="/products.html">Products</a>
        <a class="nav-link" href="/search.html">Search</a>
        <a class="nav-link" href="/checkout.html">Checkout</a>
        <a class="nav-link" href="/orders.html">Orders</a>
        <a class="nav-link" href="/contact.html">Contact</a>
      </div>
    </div>
  </div>
</nav>
<main class="container">
<section class="hero pb-3"><h1 class="display-6 fw-bold text-dark">Demo orders</h1><p class="lead">Orders created during the current server session appear here.</p></section>
<section class="soft-card p-4 mb-5"><div class="d-flex justify-content-between align-items-center gap-2 flex-wrap"><h2 class="h4 fw-bold text-dark mb-0">Order history</h2><button class="btn btn-outline-primary" id="refreshOrders">Refresh (GET)</button></div><p id="ordersStatus" class="status mt-3" aria-live="polite"></p><div id="ordersList"></div></section>

</main>
<footer class="mt-5 py-4 border-top border-2">
  <div class="container d-flex flex-wrap justify-content-between gap-2">
    <span>© 2026 Parking Meter Store — Student project demo</span>
    <div><a href="/">Home</a><a href="/contact.html">Contact Us</a><a href="/search.html">Search</a></div>
  </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/app.js"></script>
<script>
async function loadOrders(){
 const status=document.getElementById("ordersStatus"), holder=document.getElementById("ordersList");
 try{
  // GET retrieves the orders held in the server's memory.
  const response=await fetch("/api/orders"), data=await response.json();
  status.textContent=`HTTP ${response.status} — ${data.orders.length} order(s) in this server session.`;
  holder.innerHTML=data.orders.length?data.orders.slice().reverse().map(o=>`<article class="border rounded-4 p-3 mb-3"><div class="d-flex flex-wrap justify-content-between gap-2"><h3 class="h6 fw-bold">Order #${o.id} — ${o.name}</h3><strong>${money(o.total)}</strong></div><p class="mb-1 text-secondary">${o.email}</p><ul class="mb-0">${o.items.map(i=>`<li>${i.quantity} × ${i.name}</li>`).join("")}</ul></article>`).join(""):'<p>No orders yet. Place a demo order on the Checkout page.</p>';
 }catch{status.textContent="Could not load orders.";}
}
document.getElementById("refreshOrders").addEventListener("click",loadOrders);loadOrders();
</script>
</body>
</html>
