<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search | Parking Meter Store</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
:root { --primary:#2563eb; --dark:#1e293b; --light:#f8fafc; --text:#334155; --success:#16a34a; }
body { margin:0; font-family:'Segoe UI',Roboto,Arial,sans-serif; color:var(--text); background:linear-gradient(135deg,#e0eafc 0%,#cfdef3 100%); min-height:100vh; display:flex; flex-direction:column; }
.navbar, footer { background:rgba(255,255,255,.94); border-color:#b0c4de!important; }
.navbar-brand { font-weight:800; color:var(--dark)!important; }
main { flex:1; }
.hero { padding:3rem 0 2rem; }
.hero-panel, .soft-card { background:white; border:1px solid rgba(255,255,255,.8); border-radius:24px; box-shadow:0 15px 35px rgba(0,0,0,.08); }
.product-icon { font-size:3rem; }
.price { font-size:1.35rem; font-weight:800; color:#1d4ed8; }
.btn-primary { background:linear-gradient(135deg,#3498db,#2980b9); border:0; }
.btn-primary:hover { background:#1d4ed8; }
.form-control, .form-select { border-radius:14px; padding:.75rem 1rem; }
footer a { color:#2980b9; text-decoration:none; margin-right:1rem; font-weight:600; }
footer a:hover { text-decoration:underline; }
.status { min-height:1.5rem; }
</style>
</head>
<body>
<nav class="navbar navbar-expand-lg border-bottom border-2">
  <div class="container">
    <a class="navbar-brand" href="/">🅿️ Parking Meter Store</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="mainNav">
      <div class="navbar-nav ms-auto">
        <a class="nav-link" href="/">Home</a>
        <a class="nav-link" href="/products.html">Products</a>
        <a class="nav-link" href="/search.html">Search</a>
        <a class="nav-link" href="/checkout.html">Checkout</a>
        <a class="nav-link" href="/orders.html">Orders</a>
        <a class="nav-link" href="/contact.html">Contact</a>
      </div>
    </div>
  </div>
</nav>
<main class="container">
<section class="hero pb-3"><h1 class="display-6 fw-bold text-dark">Search products</h1><p class="lead">Search by product name, category, or description.</p></section>
<section class="soft-card p-4 p-md-5 mb-5">
  <form id="searchForm" class="row g-3">
    <div class="col-md-9"><label class="form-label fw-semibold" for="query">Search term</label><input class="form-control" id="query" name="q" placeholder="Try “timer”, “accessories”, or “sign”"></div>
    <div class="col-md-3 d-flex align-items-end"><button class="btn btn-primary w-100" type="submit">Search (GET)</button></div>
  </form>
  <p id="searchStatus" class="status mt-3 mb-2" aria-live="polite"></p>
  <div id="searchResults" class="row g-3"></div>
</section>

</main> <!-- I used ai to make most of these comments btw.
This is the "redirect to x page" part of the code"-->
<footer class="mt-5 py-4 border-top border-2">
  <div class="container d-flex flex-wrap justify-content-between gap-2">
    <span>© 2026 Parking Meter Store — Student project demo</span>
    <div><a href="/">Home</a><a href="/contact.html">Contact Us</a><a href="/search.html">Search</a></div>
  </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/app.js"></script>
<script> //This is the search function. Yes, I copied it from the internet. All the code I could ever want is just online waiting to be taken.
const searchForm=document.getElementById("searchForm");
async function searchProducts(term){
  const status=document.getElementById("searchStatus"), results=document.getElementById("searchResults");
  status.textContent="Searching with GET /api/products?q=…";
  try {
    // GET sends the search term in the URL query string.
    const response=await fetch("/api/products?q="+encodeURIComponent(term));
    const data=await response.json();
    status.textContent=`${data.count} result(s) found. HTTP ${response.status}.`;
    results.innerHTML=data.products.length ? data.products.map(p=>`<div class="col-md-4"><article class="soft-card p-3 h-100"><div class="product-icon">${p.icon}</div><h2 class="h6 fw-bold text-dark mt-2">${p.name}</h2><p>${p.description}</p><p class="price">${money(p.price)}</p><button class="btn btn-primary" onclick="addToCart('${p.id}')">Add to cart</button></article></div>`).join("") : '<div class="col-12"><p>No matches. Try a different word.</p></div>';
  } catch { status.textContent="Could not reach the API. Is the server running?"; }
}
searchForm.addEventListener("submit",event=>{event.preventDefault();searchProducts(document.getElementById("query").value.trim());});
searchProducts(""); //does the search here
</script>
</body>
</html>
